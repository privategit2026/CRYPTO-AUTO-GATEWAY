name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'server/**'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Model: GPT-4.1 — TypeCheck, lint, schema validation ─────────────────
  typecheck-and-lint:
    name: TypeCheck & Lint (GPT-4.1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

  # ─── Model: GPT-4.1 — Prisma schema validation ────────────────────────────
  prisma-validate:
    name: Prisma Schema Validate (GPT-4.1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema=prisma/schema.prisma

  # ─── Model: GPT-4o — Unit & integration tests (Vitest + Supertest) ────────
  unit-and-integration-tests:
    name: Unit + Integration Tests (GPT-4o)
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint, prisma-validate]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cryptogate
          POSTGRES_PASSWORD: cryptogate_test
          POSTGRES_DB: cryptogate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cryptogate:cryptogate_test@localhost:5432/cryptogate_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_secret_that_is_at_least_64_characters_long_for_security_purposes
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: http://localhost:5173
      PORT: 4000
      NODE_ENV: test

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Seed database
        run: npm run db:seed

      - name: Run tests
        run: npm test -- --reporter=verbose

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: server/coverage/
