name: Full Stack CI — End to End

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 1: Parallel checks (fastest feedback)
  # Models: Claude Sonnet (frontend) + GPT-4.1 (backend)
  # ══════════════════════════════════════════════════════════════════════════

  frontend-checks:
    name: "Stage 1a │ Frontend TypeCheck + Lint (Claude Sonnet)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run lint

  backend-checks:
    name: "Stage 1b │ Backend TypeCheck + Lint + Schema (GPT-4.1)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prisma validate --schema=prisma/schema.prisma

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 2: Unit tests (depends on Stage 1 passing)
  # Models: GPT-4o (both frontend and backend units)
  # ══════════════════════════════════════════════════════════════════════════

  frontend-unit-tests:
    name: "Stage 2a │ Frontend Unit Tests — Vitest (GPT-4o)"
    runs-on: ubuntu-latest
    needs: [frontend-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx vitest run --reporter=verbose
        env:
          CI: true

  backend-unit-tests:
    name: "Stage 2b │ Backend Unit Tests — Vitest (GPT-4o)"
    runs-on: ubuntu-latest
    needs: [backend-checks]
    defaults:
      run:
        working-directory: server
    env:
      JWT_SECRET: test_secret_at_least_64_characters_long_for_unit_tests_only_here
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test -- --reporter=verbose

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 3: Integration tests (needs DB + Redis)
  # Model: GPT-4o
  # ══════════════════════════════════════════════════════════════════════════

  backend-integration-tests:
    name: "Stage 3 │ Backend Integration Tests — Supertest (GPT-4o)"
    runs-on: ubuntu-latest
    needs: [backend-unit-tests]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cryptogate
          POSTGRES_PASSWORD: cryptogate_ci
          POSTGRES_DB: cryptogate_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://cryptogate:cryptogate_ci@localhost:5432/cryptogate_ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_integration_secret_at_least_64_characters_long_for_security_ok
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: http://localhost:5174
      PORT: 4000
      NODE_ENV: test

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate --schema=prisma/schema.prisma
      - run: npx prisma migrate deploy --schema=prisma/schema.prisma
      - run: npm run db:seed
      - run: npm test -- --reporter=verbose

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 4: Build artifacts (needs all tests green)
  # Model: Claude Sonnet
  # ══════════════════════════════════════════════════════════════════════════

  build-frontend:
    name: "Stage 4a │ Frontend Production Build (Claude Sonnet)"
    runs-on: ubuntu-latest
    needs: [frontend-unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:4000/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  build-backend:
    name: "Stage 4b │ Backend Production Build (GPT-4.1)"
    runs-on: ubuntu-latest
    needs: [backend-integration-tests]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: server/dist/
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 5: E2E full stack tests (needs both builds)
  # Model: Claude Sonnet
  # ══════════════════════════════════════════════════════════════════════════

  e2e:
    name: "Stage 5 │ E2E Tests — Playwright (Claude Sonnet)"
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cryptogate
          POSTGRES_PASSWORD: cryptogate_e2e
          POSTGRES_DB: cryptogate_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://cryptogate:cryptogate_e2e@localhost:5432/cryptogate_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e_secret_that_is_at_least_64_characters_long_for_security_here_ok
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: http://localhost:5174
      PORT: 4000
      NODE_ENV: test
      VITE_API_BASE_URL: http://localhost:4000/api/v1
      E2E_BASE_URL: http://localhost:5174

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      - name: Install all dependencies
        run: npm ci ; cd server && npm ci

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: dist/ }

      - name: Generate Prisma client & migrate
        working-directory: server
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma migrate deploy --schema=prisma/schema.prisma
          npm run db:seed

      - name: Start backend
        working-directory: server
        run: node dist/server.js &

      - name: Wait for backend
        run: npx wait-on http://localhost:4000/api/v1/health --timeout 30000

      - name: Start frontend preview
        run: npm run preview -- --port 5174 &

      - name: Wait for frontend
        run: npx wait-on http://localhost:5174 --timeout 15000

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright
        run: npx playwright test --reporter=html

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 6: Security audit (runs after E2E passes)
  # Model: o3
  # ══════════════════════════════════════════════════════════════════════════

  security:
    name: "Stage 6 │ Security Audit — Dep Audit + CodeQL (o3)"
    runs-on: ubuntu-latest
    needs: [e2e]
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Install backend deps for audit
        working-directory: server
        run: npm ci
      - name: Backend audit
        working-directory: server
        run: npm audit --audit-level=high
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ══════════════════════════════════════════════════════════════════════════
  # FINAL: All-green gate
  # ══════════════════════════════════════════════════════════════════════════

  all-green:
    name: "✅ All Stages Passed"
    runs-on: ubuntu-latest
    needs: [e2e, security]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.e2e.result }}" != "success" || "${{ needs.security.result }}" != "success" ]]; then
            echo "One or more pipeline stages failed."
            exit 1
          fi
          echo "All pipeline stages passed successfully."
