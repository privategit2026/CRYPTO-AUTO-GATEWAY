name: E2E Tests (Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Model: Claude Sonnet — E2E full stack tests ───────────────────────────
  e2e:
    name: Playwright E2E (Claude Sonnet)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cryptogate
          POSTGRES_PASSWORD: cryptogate_e2e
          POSTGRES_DB: cryptogate_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Backend
      DATABASE_URL: postgresql://cryptogate:cryptogate_e2e@localhost:5432/cryptogate_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e_test_secret_that_is_at_least_64_characters_long_for_security
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: http://localhost:5174
      PORT: 4000
      NODE_ENV: test
      # Frontend
      VITE_API_BASE_URL: http://localhost:4000/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Backend setup ───────────────────────────────────────────────────────
      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Run DB migrations
        working-directory: server
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Seed E2E test data
        working-directory: server
        run: npm run db:seed

      - name: Start backend server
        working-directory: server
        run: npm run dev &
        env:
          NODE_ENV: test

      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:4000/api/v1/health --timeout 30000

      # ── Frontend setup ──────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Start frontend preview server
        run: npm run preview -- --port 5174 &

      - name: Wait for frontend
        run: npx wait-on http://localhost:5174 --timeout 15000

      # ── Playwright ──────────────────────────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=html

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
